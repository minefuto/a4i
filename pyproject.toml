[project]
name = "a4i"
dynamic = ["version"]
description = "CLI/Python Library for the Cisco ACI REST API"
readme = "README.md"
authors = [
    { name = "minefuto", email = "46558834+minefuto@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.9.1",
    "rich>=15.0.0",
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
a4i = "a4i.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[build-system]
requires = ["hatchling>=1.31.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.1"

[tool.hatch.build.targets.wheel]
packages = ["src/a4i"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
# 3.11 is the floor: enum.StrEnum, which the query options are built on, landed
# there.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The awaited tests are told apart by "async def" and nothing else, so they are
# written the way the synchronous ones are, one marker lighter.
asyncio_mode = "auto"
